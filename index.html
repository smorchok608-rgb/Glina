<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гончарный круг</title>
<style>
:root{--bg1:#2b241d;--bg2:#15110e;--btn:#4a3d2f;--fg:#ecdcb8;--ac:#d0a85a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.tools{position:fixed;left:max(8px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}.tools button{width:46px;height:46px}.tools svg{width:23px;height:23px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:16px;justify-content:center;align-items:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
button{width:56px;height:56px;border-radius:50%;border:2px solid var(--ac);background:var(--btn);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .12s,background .2s}
button:active{transform:scale(.92)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
button.on{background:var(--ac);color:#241a0e}
button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=range]{width:110px;accent-color:var(--ac)}
body.d .m{display:none}body:not(.d) #neu{display:none}
#pw.hint{animation:p 1.3s infinite}
@keyframes p{50%{box-shadow:0 0 0 10px #d0a85a44}}
@media (prefers-reduced-motion:reduce){#pw.hint{animation:none}}

<div class="bar">

<script>
const $=id=>document.getElementById(id),cv=$('c'),oc=document.createElement('canvas'),go=oc.getContext('2d');let g=cv.getContext('2d');const g0=g;
const N=72,TILT=.287,K=11000,ys=new Float32Array(N+1);
let cuts=[],cpath=null,ph=null,holes=[],tI=N-1,tool='hand',charge=.5,flights=[],Vv,W,H,S,dpr,cx,wy,r,A,hol,hole,tgt,ass=0,stress=0,grow=1,state='work',wheelOn=false,spd=.7,spin=0,phase=0,wet=1,fire=0,glaze,shards=[],brk=0,drops=[];
let down=0,px=0,py=0,mvT=0;
function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;oc.width=cv.width;oc.height=cv.height;S=Math.min(W/650,H/700)}
addEventListener('resize',rs);rs();
function lump(){r=new Float32Array(N).fill(78);r[N-1]=68;r[N-2]=74;A=new Float32Array(N);hol=new Uint8Array(N);hole=0;Vv=new Float32Array(N).fill(K);holes=[];cuts=[];cpath=null;ph=null;shards=[];flights=[];stress=0;grow=0;ass=0;state='work';wet=1;fire=0;document.body.classList.remove('d')}
lump();grow=1;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function geo(){let t=0;ys[0]=0;tI=0;for(let i=0;i<N;i++){t+=Vv[i]/Math.max(hol[i]?A[i]:r[i]*r[i],150);ys[i+1]=t;if(Vv[i]>5)tI=i}return t}
const Rk=k=>k<=0?r[0]:k>tI?r[tI]:(r[k-1]+r[k])/2;
const inner=i=>hol[i]?Math.sqrt(Math.max(0,r[i]*r[i]-A[i])):0;
function crash(){
 if(state!='work')return;state='broken';brk=0;const c=mix([205,165,130],[150,100,72],wet);
 shards=[];for(let k=0;k<=N;k+=4)for(const sd of[-1,1]){const R=Rk(k);
  shards.push({x:cx+sd*R*.7*S,y:wy-ys[k]*S,vx:sd*(30+Math.random()*200)*S,vy:-Math.random()*260*S,a:Math.random()*6,va:(Math.random()-.5)*10,s:(9+Math.random()*18)*S,c,o:[0,1,2,3].map(()=>.5+Math.random()*.7)})}
}
function chunk(x,y,sd,c,sz){shards.push({x,y,vx:sd*(100+Math.random()*200)*S,vy:-Math.random()*220*S,a:Math.random()*6,va:(Math.random()-.5)*10,s:sz*S*(.6+Math.random()*.8),c,t:0,o:[0,1,2,3].map(()=>.5+Math.random()*.7)})}
const baseC=()=>mix([205,165,130],[150,100,72],wet);
function addClay(h,sz){
 if(wet<.2){for(let i=0;i<6;i++)chunk(cx+(Math.random()-.5)*60*S,wy-Math.max(0,h)*S,i%2?1:-1,baseC(),7);return}
 const c=Math.min(Math.max(h,0),ys[N]),sg=10+12*sz;
 for(let j=0;j<=tI;j++){const d=c-(ys[j]+ys[j+1])/2,w=Math.exp(-((d/sg)*(d/sg)));if(w<.03)continue;
  const dV=5500*sz*w,f=1+.6*dV/Vv[j];r[j]=Math.min(190,r[j]*Math.sqrt(f));if(hol[j])A[j]*=f;Vv[j]+=dV}

function throwLump(){flights.push({sx:px<cx?-30:W+30,sy:py+90*S,tx:px,ty:py,t:0,T:.45,sz:charge,h:(wy-py)/S})}
function cut(){const h=(wy-py)/S;if(h<8||h>=ys[N]-3)return;const c=baseC(),top=r[tI],t0=ys[N];

 for(let i=0;i<9;i++)chunk(cx+(i%2?1:-1)*top*.5*S,wy-(h+(t0-h)*Math.random())*S,i%2?1:-1,c,16);hole=0}
function surf(th,j,x0){const i=Math.max(0,Math.min(N-1,j|0)),R=r[i],Y=ys[i]+(ys[i+1]-ys[i])*(j-i),f=th+phase,cs=Math.cos(f);
 return cs>.03?[x0+R*S*Math.sin(f),wy-Y*S+R*S*TILT*cs,cs]:[x0+R*S*(Math.sin(f)>0?1:-1),wy-Y*S,0]}
function shapes(){const out=[];
 for(const o of holes){const i=Math.min(N-1,o.j|0),R=r[i],Yc=ys[i]+(ys[i+1]-ys[i])*(o.j-i),pts=[];
  for(let u=0;u<16;u++){const a=u/16*6.283;pts.push({th:o.th+Math.cos(a)*o.rad/R,Y:Yc+Math.sin(a)*o.rad,i})}out.push(pts)}
 for(const o of cuts)out.push(o.p.map(q=>{const i=Math.max(0,Math.min(N-1,q.j|0));return{th:q.th,Y:ys[i]+(ys[i+1]-ys[i])*(q.j-i),i}}));
 return out}
function pj(q,x0,off){const R=r[q.i],t=off?Math.min(R*.6,hol[q.i]?R-inner(q.i):R*.5):0,Rr=R-t,f=q.th+phase,cs=Math.cos(f);
 return cs>.03?[x0+Rr*S*Math.sin(f),wy-q.Y*S+Rr*S*TILT*cs,cs]:[x0+Rr*S*(Math.sin(f)>0?1:-1),wy-q.Y*S,0]}
function punch(c,x0){
 const sh=shapes();if(!sh.length)return;g.globalAlpha=1;g.lineJoin='round';
 const path=L=>{g.beginPath();L.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath()};
 for(const pts of sh){const P=pts.map(q=>pj(q,x0,0));if(P.every(q=>q[2]==0))continue;const I=pts.map(q=>pj(q,x0,1));
  g.globalCompositeOperation='destination-out';g.fillStyle='#000';path(P);g.fill();
  g.globalCompositeOperation='source-over';g.save();path(P);g.clip();
  g.fillStyle=rgb(c,.9);g.fillRect(0,0,W,H);
  g.fillStyle=rgb(c,.22,.88);path(I);g.fill();
  g.strokeStyle=rgb(c,.12,.7);g.lineWidth=Math.max(1,2*S);g.stroke();
  g.restore();
  g.strokeStyle=rgb(c,.45,.9);g.lineWidth=Math.max(1,2*S);path(P);g.stroke()}}
function addCutout(){const pts=cpath;cpath=null;if(!pts||pts.length<5||cuts.length>=6)return;
 const P=[];
 for(const[sx,sy]of pts){const wx=(sx-cx)/S;let h=(wy-sy)/S,q=0,j=0;
  for(let it=0;it<3;it++){j=0;for(let k=0;k<=tI;k++)if(ys[k]<=h)j=k;const R=r[j];q=Math.max(-.97,Math.min(.97,wx/R));h=Math.max(1,Math.min(ys[N]-1,(wy-sy)/S+R*TILT*Math.sqrt(1-q*q)))}
  j=0;for(let k=0;k<=tI;k++)if(ys[k]<=h)j=k;
  P.push({th:Math.asin(q)-phase,j:j+(h-ys[j])/Math.max(.001,ys[j+1]-ys[j])})}
 const t=P.map(o=>o.th),jj=P.map(o=>o.j);
 if(Math.max(...t)-Math.min(...t)>1.9||ys[Math.min(N,Math.ceil(Math.max(...jj)))]-ys[Math.floor(Math.min(...jj))]>.6*ys[N])stress+=.8;
 if(wet<.15)stress+=.7;
 cuts.push({p:P})}
function finish(){if(state!='work')return;state='done';fire=0;wheelOn=false;$('pw').classList.remove('on');
 glaze=hex(['#3f7a72','#8a3f2e','#2f4f8a','#c9b27a','#6a3f7a','#dcd5c6','#4f6b3a'][Math.random()*7|0]);document.body.classList.add('d')}
function assist(){if(state!='work'||Math.random()>.6)return;tgt=Float32Array.from(r);
 for(let p=0;p<9;p++)for(let i=1;i<N-1;i++)tgt[i]=(tgt[i-1]+2*tgt[i]+tgt[i+1])/4;
 const rr=r.slice(0,tI+1),lo=Math.min(...rr),hi=Math.max(...rr);if(hi-lo<32){const m=rr.reduce((a,b)=>a+b)/rr.length;tgt.fill(m)}ass=1}
function update(dt){
 const target=state=='done'?.3:(wheelOn&&state=='work'?spd:0);
 spin+=(target-spin)*Math.min(1,dt*2.5);if(down&&tool=='cutout'&&state=='work')spin=0;phase+=spin*dt*9;
 for(const s of shards){s.t=(s.t||0)+dt;if(s.y<wy+8*S){s.vy+=900*S*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.a+=s.va*dt}else{s.vx*=.9;s.va*=.8}}
 if(state!='broken')shards=shards.filter(s=>s.t<3);
 if(state=='broken'){brk+=dt;if(brk>1.9)lump();return}
 grow=Math.min(1,grow+dt*2);
 if(state=='done'){fire=Math.min(1,fire+dt/2.5);return}
 for(const f of flights)f.t+=dt;
 for(const f of flights)if(f.t>=f.T)addClay(f.h,f.sz);
 flights=flights.filter(f=>f.t<f.T);
 if(tool=='lump'&&down)charge=Math.min(1.6,charge+dt*1.1);

 if(tool=='poke'&&down){
  const h=(wy-py)/S,wx=(px-cx)/S;
  if(!ph&&h>3&&h<ys[N]-3&&holes.length<14){let j=0;for(let k=0;k<=tI;k++)if(ys[k]<=h)j=k;
   if(Math.abs(wx)<r[j]*.95){ph={j:j+(h-ys[j])/Math.max(.001,ys[j+1]-ys[j]),th:Math.asin(wx/r[j])-phase,rad:3};holes.push(ph)}}
  else if(ph){ph.rad=Math.min(34,ph.rad+dt*13);ph.th=Math.asin(Math.max(-.99,Math.min(.99,wx/r[Math.min(N-1,ph.j|0)])))-phase}
 }
 wet=Math.max(0,wet-dt*.02*(spin>.05?1:.15));

   }else{

   }
  }else if(tool=='comb'){
   for(let j=0;j<=tI;j++){const d=h-(ys[j]+ys[j+1])/2,w=Math.exp(-((d/5)*(d/5)));if(w<.05)continue;

   g.fillStyle=rgb(bc,.9);g.beginPath();g.ellipse(x,y,q,q*.85,u*6,0,7);g.fill();g.fillStyle='rgba(255,255,255,.2)';g.beginPath();g.arc(x-q*.3,y-q*.3,q*.3,0,7);g.fill()}
  if(down&&tool=='lump'){const q=(8+10*charge)*S;g.fillStyle=rgb(bc,.9);g.beginPath();g.arc(px,py,q,0,7);g.fill()}
  if(cpath&&cpath.length>1){g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();cpath.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();g.setLineDash([])}
  if(down&&tool=='wire'){g.strokeStyle='rgba(235,235,235,.85)';g.lineWidth=1.6;g.beginPath();g.moveTo(cx-230*S,py);g.lineTo(cx+230*S,py);g.stroke();
   g.fillStyle='#b39552';for(const sx of[-230,230]){g.beginPath();g.arc(cx+sx*S,py,6*S,0,7);g.fill()}}
 }
 g.fillStyle='rgba(120,180,230,.75)';for(const d of drops){g.beginPath();g.ellipse(d.x,d.y,3*S,5*S,0,0,7);g.fill()}
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);
cv.addEventListener('pointerdown',e=>{down=1;ph=null;charge=.5;cpath=tool=='cutout'&&state=='work'?[[e.clientX,e.clientY]]:null;px=e.clientX;py=e.clientY;mvT=performance.now();cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;mvT=performance.now();if(cpath){const l=cpath[cpath.length-1];if(Math.hypot(px-l[0],py-l[1])>7)cpath.push([px,py])}});
const up=()=>{ph=null;if(!down)return;down=0;if(state!='work')return;if(tool=='lump')throwLump();else if(tool=='wire')cut();else if(tool=='cutout')addCutout();else if(tool=='hand')assist()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('pw').onclick=e=>{wheelOn=!wheelOn;e.currentTarget.classList.toggle('on',wheelOn);e.currentTarget.classList.remove('hint')};
$('sp').oninput=e=>spd=+e.target.value;
$('wt').onclick=()=>{if(state!='work')return;for(let i=0;i<16;i++)drops.push({x:cx+(Math.random()-.5)*130*S,y:wy-(ys[N]+120+Math.random()*120)*S,vy:0})};
$('fn').onclick=finish;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});
$('neu').onclick=()=>{lump();grow=0};
